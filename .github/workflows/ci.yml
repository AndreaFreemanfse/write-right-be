name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: write_right_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user -d write_right_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/write_right_test
      API_KEY: test-key
      BASE_URL: https://api.openai.com/v1
      MODEL: gpt-4o-mini
      SUPABASE_JWKS_URL: test-jwk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall .

      - name: Verify FastAPI application imports
        run: |
          python -c "import main"

      - name: Run tests if present
        run: |
          pytest || test $? -eq 5